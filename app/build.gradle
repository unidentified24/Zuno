plugins { id 'com.android.application' }
android {
    namespace 'app.veyra'
    compileSdk 35
    defaultConfig {
        applicationId 'app.veyra'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '1.1.0-rc3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes { release { signingConfig signingConfigs.debug; debuggable false; minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = true } }
    sourceSets { main { assets.srcDirs += ["../private/assets"]; jniLibs.srcDirs += ["../private/engines/jniLibs"] } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Keep Android test downloads and lock files inside the ignored build directory.
            def testHome = layout.buildDirectory.dir("test-home").get().asFile
            def testTemp = layout.buildDirectory.dir("test-tmp").get().asFile
            systemProperty "java.io.tmpdir", testTemp.absolutePath
            systemProperty "user.home", testHome.absolutePath
            systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
            doFirst { testHome.mkdirs(); testTemp.mkdirs() }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation "com.google.android.gms:play-services-cast-framework:22.3.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
    testImplementation "org.json:json:20240303"
    def media3 = '1.8.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
}
